image: cirrusci/flutter:latest

stages:
  - build
  - deploy

build_web:
  stage: build
  script:
    - flutter pub get
    - flutter build web
  artifacts:
    paths:
      - build/web

pages:
  stage: deploy
  script:
    - mv build/web public
  artifacts:
    paths:
      - public
  only:
    - assignment2

