image: cirrusci/flutter:latest

stages:
  - build
  - deploy

before_script:
  - cd assignment2
  - flutter config --enable-web
  - flutter pub get

build_web:
  stage: build
  script:
    - cd assignment2
    - flutter build web
    - mv build/web ../public  
  artifacts:
    paths:
      - public  

deploy:
  stage: deploy
  script:
    - echo "Deployment step (GitLab Pages handles this automatically)"
  only:
    - assignment2 

